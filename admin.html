<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moule & Smile — Admin Carte</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#1A1A1A;color:#fff;min-height:100vh}
.header{background:#111;padding:12px 20px;border-bottom:2px solid #D4AF37;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header h1{color:#D4AF37;font-size:16px}
.save-btn{background:#D4AF37;color:#1A1A1A;border:none;padding:8px 18px;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer}
.content{padding:16px;max-width:600px;margin:0 auto}
.cat-tabs{display:flex;overflow-x:auto;gap:8px;padding:0 0 12px;scrollbar-width:none;margin-bottom:16px}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;padding:8px 14px;background:#2A2A2A;border:2px solid #333;border-radius:20px;font-size:12px;font-weight:bold;cursor:pointer;color:#aaa;white-space:nowrap}
.cat-tab.active{background:#D4AF37;color:#1A1A1A;border-color:#D4AF37}
.section{background:#222;border-radius:14px;padding:16px;margin-bottom:16px}
.section h2{color:#D4AF37;font-size:14px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #333}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #2A2A2A}
.item-row:last-child{border-bottom:none}
.item-info{flex:1}
.item-nom{font-size:13px;font-weight:bold}
.item-detail{font-size:11px;color:#888;margin-top:2px}
.toggle{position:relative;width:50px;height:26px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#444;border-radius:26px;transition:.3s}
.toggle-slider:before{position:absolute;content:"";height:18px;width:18px;left:4px;bottom:4px;background:white;border-radius:50%;transition:.3s}
.toggle input:checked+.toggle-slider{background:#D4AF37}
.toggle input:checked+.toggle-slider:before{transform:translateX(24px)}
.prix-input{background:#333;border:1px solid #D4AF37;border-radius:6px;color:#D4AF37;font-weight:bold;font-size:13px;padding:4px 8px;width:75px;text-align:center;margin-left:8px}
.status-bar{background:#1A3A2A;border:1px solid #1A7A50;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#4ABA80;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;background:#4ABA80;border-radius:50%;animation:blink 1.5s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#D4AF37;color:#1A1A1A;padding:10px 22px;border-radius:30px;font-weight:bold;font-size:13px;z-index:999;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.btn-vert{background:#1A7A50;color:white;border:none;padding:12px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:13px}
.btn-rouge{background:#C0392B;color:white;border:none;padding:12px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:13px}
.version{text-align:center;padding:16px;color:#333;font-size:10px}
</style>
</head>
<body>

<div class="header">
  <h1>⚙️ Admin — Moule & Smile</h1>
  <button class="save-btn" onclick="sauvegarder()">💾 Publier</button>
</div>

<div class="toast" id="toast"></div>

<div class="content">
  <div class="status-bar"><div class="dot"></div>Modifications publiées instantanément sur tous les téléphones clients</div>
  <div class="cat-tabs" id="catTabs"></div>
  <div id="catContent"></div>
  <div class="actions">
    <button class="btn-vert" onclick="toutActiver()">✅ Tout activer (début de service)</button>
    <button class="btn-rouge" onclick="resetJour()">🗑️ Réinitialiser commandes du jour</button>
  </div>
</div>

<div class="version">v.12/08/2026 14:00 — Moule & Smile Admin</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDUb3LtVsMAq986DgtHwkMBeQFr8A8A2nU",
  authDomain: "commandemoulesmile.firebaseapp.com",
  projectId: "commandemoulesmile",
  storageBucket: "commandemoulesmile.firebasestorage.app",
  messagingSenderId: "303564394584",
  appId: "1:303564394584:web:cbde6960f99cac83517a2d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let carte = null;
let catActive = null;

db.collection('config').doc('carte_v2').onSnapshot(doc => {
  if (doc.exists && doc.data().categories) {
    carte = doc.data();
    if (!catActive && carte.categories.length) catActive = carte.categories[0].id;
    render();
  }
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function render() {
  if (!carte) return;
  // Tabs
  document.getElementById('catTabs').innerHTML = carte.categories.map(c =>
    `<div class="cat-tab ${c.id===catActive?'active':''}" onclick="selectCat('${c.id}')">${c.nom}</div>`
  ).join('');
  // Content
  const cat = carte.categories.find(c => c.id === catActive);
  if (!cat) return;
  document.getElementById('catContent').innerHTML = `
    <div class="section">
      <h2>${cat.nom}</h2>
      ${(cat.produits||[]).map((p, idx) => `
        <div class="item-row">
          <div class="item-info">
            <div class="item-nom">${p.emoji||''} ${p.nom}</div>
            <div class="item-detail">${p.desc||''}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            ${p.prix > 0 ? `<input type="number" class="prix-input" value="${p.prix}" step="0.10" onchange="updatePrix('${catActive}',${idx},this.value)"> €` : '<span style="color:#1A7A50;font-size:11px;font-weight:bold">Inclus</span>'}
            <label class="toggle" style="margin-left:8px">
              <input type="checkbox" ${p.actif?'checked':''} onchange="toggleItem('${catActive}',${idx},this.checked)">
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      `).join('')}
    </div>`;
}

function selectCat(id) {
  catActive = id;
  render();
}

function toggleItem(catId, idx, val) {
  const cat = carte.categories.find(c => c.id === catId);
  if (!cat) return;
  cat.produits[idx].actif = val;
  const nom = cat.produits[idx].nom;
  showToast(`${nom} ${val?'✅ activé':'❌ désactivé'}`);
  sauvegarder();
}

function updatePrix(catId, idx, val) {
  const cat = carte.categories.find(c => c.id === catId);
  if (!cat) return;
  cat.produits[idx].prix = parseFloat(val) || 0;
  sauvegarder();
}

async function sauvegarder() {
  try {
    await db.collection('config').doc('carte_v2').set(carte);
    showToast('✅ Carte publiée !');
  } catch(e) {
    showToast('❌ Erreur de connexion');
  }
}

function toutActiver() {
  carte.categories.forEach(c => (c.produits||[]).forEach(p => p.actif = true));
  sauvegarder();
  render();
  showToast('✅ Tous les produits activés !');
}

async function resetJour() {
  if (!confirm('Supprimer toutes les commandes du jour ? Action irréversible.')) return;
  const snap = await db.collection('commandes').get();
  const batch = db.batch();
  snap.forEach(d => batch.delete(d.ref));
  const snap2 = await db.collection('additions').get();
  snap2.forEach(d => batch.delete(d.ref));
  await batch.commit();
  showToast('🗑️ Commandes supprimées');
}
</script>
</body>
</html>
