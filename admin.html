<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moule & Smile — Admin Carte</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#1A1A1A;color:#fff;min-height:100vh;padding-bottom:40px}
.header{background:#111;padding:12px 20px;border-bottom:2px solid #D4AF37;display:flex;justify-content:space-between;align-items:center}
.header h1{color:#D4AF37;font-size:15px}
.save-btn{background:#D4AF37;color:#1A1A1A;border:none;padding:8px 16px;border-radius:8px;font-weight:bold;font-size:12px;cursor:pointer}
.nav-tabs{display:flex;background:#111;border-bottom:2px solid #D4AF37}
.nav-tab{flex:1;padding:12px 8px;text-align:center;cursor:pointer;font-size:11px;color:#888;border-bottom:3px solid transparent;font-weight:bold}
.nav-tab.active{color:#D4AF37;border-bottom-color:#D4AF37}
.content{padding:16px;max-width:620px;margin:0 auto;display:none}
.content.active{display:block}
.cat-tabs{display:flex;overflow-x:auto;gap:8px;padding:0 0 12px;margin-bottom:12px}
.cat-tab{flex-shrink:0;padding:7px 12px;background:#2A2A2A;border:2px solid #333;border-radius:20px;font-size:11px;font-weight:bold;cursor:pointer;color:#aaa}
.cat-tab.active{background:#D4AF37;color:#1A1A1A}
.section{background:#222;border-radius:12px;padding:14px;margin-bottom:14px}
.section h2{color:#D4AF37;font-size:13px;margin-bottom:10px;border-bottom:1px solid #333}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #2A2A2A}
.item-nom{font-size:13px;font-weight:bold}
.add-form{background:#1E2A1E;border:2px solid #1A7A50;border-radius:12px;padding:16px;margin-bottom:14px}
.add-form h3{color:#4ABA80;font-size:14px;margin-bottom:12px}
.form-row{display:flex;gap:10px;margin-bottom:10px}
.form-group{flex:1;display:flex;flex-direction:column}
.form-group label{font-size:11px;color:#888;font-weight:bold}
.form-group input,.form-group select{background:#2A2A2A;border:1px solid #444;border-radius:8px;color:#fff;padding:9px 10px;font-size:13px}
.btn-add{background:#1A7A50;color:white;border:none;padding:11px 20px;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer;width:100%}
.import-zone{background:#1A1A2E;border:2px dashed #444;border-radius:12px;padding:24px;text-align:center;margin-bottom:16px;cursor:pointer}
.import-zone.dragover{border-color:#D4AF37;background:#1E1A2E}
.btn-confirm{background:#D4AF37;color:#1A1A1A;border:none;padding:12px;border-radius:8px;font-weight:bold;width:100%;margin-top:12px}
.btn-cancel{background:#333;color:#aaa;border:none;padding:10px;border-radius:8px;width:100%;margin-top:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#D4AF37;color:#1A1A1A;padding:10px 22px;border-radius:30px;font-weight:bold;z-index:999;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.badge{background:#D4AF37;color:#1A1A1A;font-size:10px;font-weight:bold;padding:2px 6px;border-radius:10px;margin-left:6px}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>⚙️ Admin — Moule & Smile</h1>
    <div style="font-size:10px;color:#888;margin-top:2px">v.<span id="timestamp"></span></div>
  </div>
  <button class="save-btn" onclick="sauvegarder()">💾 Publier</button>
</div>

<div class="nav-tabs" style="overflow-x:auto">
  <div class="nav-tab active" onclick="switchTab('carte',this)">📋 Carte</div>
  <div class="nav-tab" onclick="switchTab('ajouter',this)">➕ Ajouter</div>
  <div class="nav-tab" onclick="switchTab('excel',this)">📥 Excel</div>
  <div class="nav-tab" onclick="switchTab('actions',this)">⚡ Actions</div>
  <div class="nav-tab" onclick="switchTab('reglages',this)">⚙️ Réglages</div>
</div>

<!-- ONGLET CARTE -->
<div id="carte" class="content active">
  <div class="cat-tabs" id="catTabs"></div>
  <div id="carteContent"></div>
</div>

<!-- ONGLET AJOUTER -->
<div id="ajouter" class="content">
  <div class="add-form">
    <h3>➕ Ajouter un produit</h3>
    <div class="form-row">
      <div class="form-group" style="flex:2"><label>Catégorie *</label><select id="newCat"></select></div>
      <div class="form-group" style="flex:1"><label>Emoji</label><input type="text" id="newEmoji" placeholder="🍺" maxlength="4"></div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:2"><label>Nom *</label><input type="text" id="newNom" placeholder="Ex: Coca-Cola"></div>
      <div class="form-group" style="flex:1"><label>Prix (€)</label><input type="number" id="newPrix" placeholder="3.50" step="0.10" min="0"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Description</label><input type="text" id="newDesc" placeholder="Ex: 33cl"></div>
    </div>
    <button class="btn-add" onclick="ajouterProduit()">✅ Ajouter</button>
  </div>
</div>

<!-- ONGLET EXCEL -->
<div id="excel" class="content">
  <div class="section">
    <h2>📥 Importer Excel</h2>
    <div class="import-zone" id="importZone" ondrop="handleDrop(event)" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')">
      <div style="font-size:36px">📄</div>
      <h3>Déposer fichier Excel ici</h3>
      <p>ou cliquez pour sélectionner<br>Formats : .xlsx · .xls</p>
      <input type="file" id="importInput" class="import-input" accept=".xlsx,.xls" onchange="handleFile(this.files[0])">
      <button class="btn-add" onclick="document.getElementById('importInput').click()">Sélectionner fichier</button>
    </div>
    <div id="importPreview" style="display:none">
      <button class="btn-confirm" onclick="confirmerImport()">✅ Confirmer et publier</button>
      <button class="btn-cancel" onclick="annulerImport()">✕ Annuler</button>
    </div>
  </div>
</div>

<!-- ONGLET ACTIONS -->
<div id="actions" class="content">
  <div class="section">
    <h2>⚡ Actions rapides</h2>
    <button class="btn-add" style="margin-bottom:8px" onclick="toutActiver()">✅ Tout activer</button>
    <button class="btn-add" style="background:#C0392B;margin-bottom:8px" onclick="resetJour()">🗑️ Réinitialiser du jour</button>
    <button class="btn-add" style="background:#D4AF37;color:#1A1A1A;margin-bottom:8px" onclick="sauvegarder()">💾 Publier</button>
  </div>
  <div class="section" id="statsDiv"></div>
</div>

<!-- ONGLET RÉGLAGES -->
<div id="reglages" class="content">
  <div class="section">
    <h2>⚙️ Réglages</h2>
    <p style="color:#aaa;font-size:12px">Les fonctionnalités avancées seront ajoutées prochainement.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
// ============================================================
// FIREBASE CONFIG
// ============================================================
const firebaseConfig={apiKey:"AIzaSyAkhH8s6TBz_2aLPVQnCEfwPm3DNKX2OGQ",projectId:"commandemoulesmile",authDomain:"commandemoulesmile.firebaseapp.com",databaseURL:"https://commandemoulesmile.firebaseio.com",storageBucket:"commandemoulesmile.appspot.com",messagingSenderId:"1007929131430"};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

// ============================================================
// STATE GLOBAL
// ============================================================
let carte=null;
let catActive=null;
let importedData=null;

// ============================================================
// INITIALISATION
// ============================================================
async function init(){
  console.log('🔄 Démarrage initialisation...');
  
  // Afficher timestamp
  const now=new Date();
  document.getElementById('timestamp').textContent=`${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  
  // Charger carte_v2
  try{
    const doc=await db.collection('config').doc('carte_v2').get();
    if(doc.exists){
      carte=doc.data();
      console.log('✅ Carte chargée:', carte.categories?.length, 'catégories');
    } else {
      console.error('Pas de carte_v2');
      showToast('⚠️ Pas de carte trouvée');
      return;
    }
  }catch(e){
    console.error('Erreur chargement:', e);
    showToast('❌ Erreur Firebase');
    return;
  }
  
  // Afficher la carte
  if(carte && carte.categories && carte.categories.length){
    catActive=carte.categories[0].id;
    render();
    remplirSelectCategories();
  }
  
  console.log('✅ Initialisation complète');
}

// ============================================================
// AFFICHAGE
// ============================================================
function render(){
  if(!carte || !carte.categories)return;
  
  // Tabs catégories
  const tabs=carte.categories.map(c=>`<div class="cat-tab ${c.id===catActive?'active':''}" onclick="selectCat('${c.id}')">${c.nom}</div>`).join('');
  document.getElementById('catTabs').innerHTML=tabs;
  
  // Produits
  const cat=carte.categories.find(c=>c.id===catActive);
  if(!cat)return;
  
  let html=`<div class="section"><h2>${cat.nom} <span class="badge">${(cat.produits||[]).filter(p=>p.actif!==false).length} actifs</span></h2>`;
  (cat.produits||[]).forEach(p=>{
    html+=`<div class="item-row">
      <div><div class="item-nom">${p.nom} <span style="color:#888;font-size:10px">(${p.id})</span></div><div style="color:#888;font-size:11px">${p.desc||''}</div></div>
      <div style="display:flex;gap:10px;align-items:center">
        <span style="font-weight:bold;color:#D4AF37">${p.prix||0}€</span>
        <label class="toggle"><input type="checkbox" ${p.actif!==false?'checked':''} onchange="modifierActif('${catActive}','${p.id}',this.checked)"><span class="toggle-slider"></span></label>
      </div>
    </div>`;
  });
  html+=`</div>`;
  document.getElementById('carteContent').innerHTML=html;
}

function selectCat(id){
  catActive=id;
  render();
}

function remplirSelectCategories(){
  if(!carte || !carte.categories)return;
  const sel=document.getElementById('newCat');
  sel.innerHTML='';
  carte.categories.forEach(c=>{
    const opt=document.createElement('option');
    opt.value=c.id;
    opt.textContent=c.nom;
    sel.appendChild(opt);
  });
}

// ============================================================
// FONCTIONS
// ============================================================
function switchTab(tabId,el){
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
}

async function ajouterProduit(){
  const nom=document.getElementById('newNom').value.trim();
  const catId=document.getElementById('newCat').value;
  const prix=parseFloat(document.getElementById('newPrix').value)||0;
  const desc=document.getElementById('newDesc').value.trim();
  const emoji=document.getElementById('newEmoji').value.trim()||'📦';
  
  if(!nom){showToast('⚠️ Nom requis');return;}
  
  const cat=carte.categories.find(c=>c.id===catId);
  if(!cat){showToast('⚠️ Catégorie invalide');return;}
  
  const id='p'+(Date.now()%10000);
  cat.produits.push({id,nom,prix,desc,emoji,actif:true});
  
  document.getElementById('newNom').value='';
  document.getElementById('newPrix').value='';
  document.getElementById('newDesc').value='';
  document.getElementById('newEmoji').value='';
  
  await sauvegarder();
  render();
  showToast('✅ Produit ajouté');
}

async function modifierActif(catId,prodId,actif){
  const cat=carte.categories.find(c=>c.id===catId);
  if(!cat)return;
  const prod=cat.produits.find(p=>p.id===prodId);
  if(prod)prod.actif=actif;
  await sauvegarder();
}

async function sauvegarder(){
  try{
    await db.collection('config').doc('carte_v2').set(carte);
    showToast('✅ Carte sauvegardée');
  }catch(e){
    console.error('Erreur sauvegarde:', e);
    showToast('❌ Erreur sauvegarde');
  }
}

function handleDrop(e){
  e.preventDefault();
  document.getElementById('importZone').classList.remove('dragover');
  const file=e.dataTransfer.files[0];
  if(file)handleFile(file);
}

async function handleFile(file){
  if(!file)return;
  try{
    const data=await file.arrayBuffer();
    const wb=XLSX.read(data);
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws);
    importedData=rows;
    document.getElementById('importPreview').style.display='block';
    showToast('✅ Fichier chargé: '+rows.length+' lignes');
  }catch(e){
    console.error('Erreur import:', e);
    showToast('❌ Erreur lecture Excel');
  }
}

async function confirmerImport(){
  if(!importedData)return;
  // Import basique
  importedData.forEach(row=>{
    if(!row.cat||!row.nom)return;
    const cat=carte.categories.find(c=>c.id===row.cat);
    if(cat){
      if(!cat.produits)cat.produits=[];
      if(!cat.produits.find(p=>p.id===row.id)){
        cat.produits.push({
          id:row.id||'p'+(Date.now()%10000),
          nom:row.nom,
          prix:parseFloat(row.prix)||0,
          desc:row.desc||'',
          emoji:row.emoji||'📦',
          actif:row.actif!==false
        });
      }
    }
  });
  await sauvegarder();
  annulerImport();
  render();
  showToast('✅ Import réussi');
}

function annulerImport(){
  importedData=null;
  document.getElementById('importPreview').style.display='none';
  document.getElementById('importInput').value='';
}

function toutActiver(){
  if(!carte)return;
  carte.categories.forEach(c=>{
    (c.produits||[]).forEach(p=>p.actif=true);
  });
  sauvegarder();
  render();
  showToast('✅ Tous les produits activés');
}

async function resetJour(){
  if(confirm('Réinitialiser les stats du jour?')){
    try{
      await db.collection('config').doc('statsParams').set({lastReset:new Date()});
      showToast('✅ Stats réinitialisées');
    }catch(e){
      showToast('❌ Erreur reset');
    }
  }
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ============================================================
// DÉMARRAGE
// ============================================================
window.addEventListener('load',init);
</script>

</body>
</html>
