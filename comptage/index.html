<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Comptage Caisse — Moule &amp; Smile</title>
<meta name="theme-color" content="#0A0C11">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- ============================================================ -->
<!-- STYLES -->
<!-- ============================================================ -->
<style>
:root{
  --bg:#0A0C11;
  --bg-deep:#06070A;
  --surface:#11141B;
  --surface-2:#161A23;
  --surface-3:#1D222D;
  --border:#262C39;
  --line:rgba(255,255,255,.06);
  --line-strong:rgba(255,255,255,.11);
  --text:#EDEEF2;
  --text-2:#B3B8C6;
  --muted:#868C9C;
  --faint:#5A6070;
  --gold:#E2BE6A;
  --gold-hi:#F3DCA0;
  --gold-lo:#B8913F;
  --gold-soft:rgba(226,190,106,.12);
  --gold-ring:rgba(226,190,106,.35);
  --ink:#16120A;
  --green:#3FD18A;
  --green-deep:#1E8F5C;
  --green-bg:rgba(63,209,138,.08);
  --red:#F07575;
  --danger:#E5484D;
  --red-bg:rgba(240,117,117,.09);
  --violet:#A98BFA;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -12px rgba(0,0,0,.6);
  --grad-gold:linear-gradient(135deg,var(--gold-hi) 0%,var(--gold) 45%,var(--gold-lo) 100%);
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --font-display:"Instrument Serif",Georgia,serif;
  --side:240px;
  --blue:#62B6FF;
  --blue-hi:#9CCFFF;
  --blue-deep:#2F6FB8;
  --blue-bg:rgba(98,182,255,.09);
  --orange:#F0954A;
  --amber:#E8A83C;
  --amber-bg:rgba(232,168,60,.1);
  --green-hi:#8EF0B8;
  --violet-hi:#CDB8FF;
  --violet-bg:rgba(169,139,250,.1);
}

:root{
  --app-terracotta:#22863a;
  --app-terracotta-dark:#176929;
  --app-ivoire:#f4f6f4;
  --app-ivoire-dark:#e0e8e1;
  --app-teal:#1a7a3c;
  --app-teal-dark:#0f4f26;
  --app-teal-light:#28a745;
  --app-ink:#1a1a1a;
  --app-ink-soft:#4a5a4a;
  --app-ecart-ok:#2d7d4f;
  --app-ecart-warn:#c19a2e;
  --app-ecart-bad:#b6402f;
  --app-border:#c8dbc8;
  --radius:14px;
  --shadow:0 2px 10px rgba(10,30,15,0.10);
  --shadow-lg:0 8px 28px rgba(10,30,15,0.16);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0;}

html,body{
  font-family:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

@font-face{font-family:'Figtree';src:local('Figtree');}

h1,h2,h3{
  font-family:'Cormorant',Georgia,serif;
  margin:0;
  color:var(--text);
  letter-spacing:.2px;
}

#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* ---------- HEADER ---------- */
.topbar{
  background:var(--bg-deep);
  color:var(--text);
  padding:16px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 2px 12px rgba(0,0,0,0.35);
}
.topbar h1{
  color:var(--text);
  font-size:20px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:8px;
  letter-spacing:.5px;
}
.topbar .sub{
  font-size:11px;
  color:var(--green);
  font-family:'Figtree',sans-serif;
  margin-top:1px;
  font-weight:600;
  letter-spacing:.3px;
}
.btn-icon{
  background:rgba(255,255,255,0.12);
  border:none;
  color:var(--text);
  width:38px;
  height:38px;
  border-radius:10px;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.btn-icon:active{background:rgba(255,255,255,0.25);}

.sync-pill{
  font-size:10px;
  padding:3px 9px;
  border-radius:20px;
  background:rgba(255,255,255,0.1);
  display:inline-flex;
  align-items:center;
  gap:5px;
  color:var(--faint);
}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green-deep);}
.sync-dot.off{background:var(--danger);}
.sync-dot.busy{background:var(--gold);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.topbar .build-tag{font-size:9.5px; color:var(--muted); margin-top:2px; font-family:'Figtree',sans-serif;}

/* ---------- MAIN CONTENT ---------- */
#screen{
  flex:1;
  padding:16px 16px 100px;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}

.card-title{
  font-size:13px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.6px;
  color:var(--green);
  margin-bottom:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

/* ---------- BUTTONS ---------- */
.btn{
  border:none;
  border-radius:10px;
  padding:13px 18px;
  font-size:15px;
  font-weight:600;
  font-family:'Figtree',sans-serif;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:transform .08s, opacity .15s;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--green-deep); color:var(--text); width:100%;}
.btn-primary:active{background:var(--surface-3);}
.btn-secondary{background:var(--surface-2); color:var(--text); width:100%;}
.btn-ghost{background:transparent; color:var(--green); border:1.5px solid var(--green-deep); width:100%;}
.btn-danger{background:transparent; color:var(--red); border:1.5px solid var(--red);}
.btn-sm{padding:8px 14px; font-size:13px; width:auto;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-full-row{display:flex; gap:10px;}

/* ---------- FORM ELEMENTS ---------- */
label{
  font-size:12.5px;
  font-weight:600;
  color:var(--text-2);
  display:block;
  margin-bottom:6px;
}
input[type=text], input[type=number], input[type=password], select, textarea{
  width:100%;
  padding:12px 13px;
  border:1.5px solid var(--border);
  border-radius:10px;
  font-size:16px;
  font-family:'Figtree',sans-serif;
  background:var(--surface);
  color:var(--text);
  margin-bottom:14px;
}
input:focus, select:focus, textarea:focus{
  outline:none;
  border-color:var(--green-deep);
}
input[type=number]{text-align:right; font-weight:600;}

.field-row{display:flex; gap:10px;}
.field-row > div{flex:1;}

/* ---------- DENOMINATION GRID ---------- */
.denom-section-label{
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.8px;
  color:var(--text-2);
  margin:16px 0 8px;
  padding-bottom:6px;
  border-bottom:1px solid var(--border);
}
.denom-section-label:first-child{margin-top:0;}
.denom-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:7px 0;
}
.denom-label{
  width:64px;
  flex-shrink:0;
  font-weight:700;
  font-size:15px;
  color:var(--text);
}
.denom-qty{
  flex:1;
}
.denom-qty input{
  margin-bottom:0;
  text-align:center;
  padding:10px 8px;
}
.denom-eq{
  width:14px;
  text-align:center;
  color:var(--text-2);
  flex-shrink:0;
}
.denom-total{
  width:76px;
  text-align:right;
  flex-shrink:0;
  font-weight:700;
  font-size:14.5px;
  color:var(--text);
}

.stepper{
  display:flex;
  align-items:center;
  border:1.5px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  background:var(--surface);
}
.stepper button{
  width:34px;
  height:40px;
  border:none;
  background:var(--surface-2);
  color:var(--text);
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  flex-shrink:0;
}
.stepper button:active{background:var(--surface-2);}
.stepper input{
  border:none;
  flex:1;
  width:100%;
  text-align:center;
  font-weight:700;
  padding:10px 2px;
}
.stepper input:focus{outline:none;}

/* ---------- TOTAL BANNER ---------- */
.total-banner{
  background:var(--surface-3);
  color:var(--text);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.total-banner .lbl{font-size:12px; color:var(--faint); text-transform:uppercase; letter-spacing:.6px; font-weight:600;}
.total-banner .val{font-family:'Cormorant',serif; font-size:30px; font-weight:700; color:var(--text);}

/* ---------- ECART ---------- */
.ecart-box{
  border-radius:var(--radius);
  padding:16px 18px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:1.5px solid;
}
.ecart-box.ok{background:var(--bg); border-color:var(--green-deep);}
.ecart-box.warn{background:var(--bg); border-color:var(--gold);}
.ecart-box.bad{background:var(--bg); border-color:var(--red);}
.ecart-box .lbl{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;}
.ecart-box.ok .lbl, .ecart-box.ok .val{color:var(--green);}
.ecart-box.warn .lbl, .ecart-box.warn .val{color:var(--gold);}
.ecart-box.bad .lbl, .ecart-box.bad .val{color:var(--red);}
.ecart-box .val{font-family:'Cormorant',serif; font-size:26px; font-weight:700;}

/* ---------- BOTTOM NAV ---------- */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:var(--bg-deep);
  border-top:1px solid var(--border);
  display:flex;
  max-width:560px;
  margin:0 auto;
  box-shadow:0 -4px 16px rgba(0,0,0,0.30);
  z-index:50;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{
  flex:1;
  padding:9px 2px 7px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  background:none;
  border:none;
  color:var(--text-2);
  cursor:pointer;
  font-family:'Figtree',sans-serif;
  min-width:0;
}
.nav-item.active{color:var(--green);}
.nav-item .ic{font-size:18px;}
.nav-item .lb{font-size:9.5px; font-weight:700; white-space:nowrap;}

/* ---------- LISTS / HISTORY ---------- */
.hist-item{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
}
.hist-item:active{background:var(--surface-2);}
.hist-main{display:flex; flex-direction:column; gap:3px;}
.hist-titre{font-weight:700; font-size:14.5px; color:var(--text);}
.hist-meta{font-size:12px; color:var(--text-2);}
.hist-right{text-align:right;}
.hist-montant{font-weight:700; font-size:15px; font-family:'Cormorant',serif; font-size:19px;}
.hist-badge{
  font-size:10.5px;
  font-weight:700;
  padding:2px 8px;
  border-radius:20px;
  margin-top:4px;
  display:inline-block;
}
.hist-badge.ok{background:var(--bg); color:var(--green);}
.hist-badge.warn{background:var(--bg); color:var(--gold);}
.hist-badge.bad{background:var(--bg); color:var(--red);}

.empty-state{
  text-align:center;
  padding:50px 20px;
  color:var(--text-2);
}
.empty-state .ic{font-size:42px; margin-bottom:10px; opacity:.5;}
.empty-state p{font-size:14px; margin:4px 0;}

.filter-bar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
  margin-bottom:14px;
}
.filter-chip{
  flex-shrink:0;
  padding:7px 14px;
  border-radius:20px;
  border:1.5px solid var(--border);
  background:var(--surface);
  font-size:12.5px;
  font-weight:600;
  color:var(--text-2);
  cursor:pointer;
  white-space:nowrap;
}
.filter-chip.active{background:var(--surface-3); color:var(--text); border-color:var(--border);}

/* ---------- MODAL ---------- */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(42,37,33,0.5);
  z-index:200;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.modal-overlay.center{align-items:center; padding:20px;}
.modal-sheet{
  background:var(--surface);
  width:100%;
  max-width:560px;
  border-radius:20px 20px 0 0;
  padding:22px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:88vh;
  overflow-y:auto;
}
.modal-overlay.center .modal-sheet{
  border-radius:18px;
  max-height:80vh;
}
.modal-handle{
  width:40px; height:4px;
  background:var(--surface-2);
  border-radius:4px;
  margin:0 auto 16px;
}
.modal-title{
  font-family:'Cormorant',serif;
  font-size:21px;
  font-weight:700;
  color:var(--text);
  margin-bottom:16px;
}

/* ---------- TOAST ---------- */
#toast{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--surface);
  color:var(--text);
  padding:11px 20px;
  border-radius:30px;
  font-size:13.5px;
  font-weight:600;
  z-index:300;
  opacity:0;
  transition:all .25s;
  pointer-events:none;
  max-width:90%;
  text-align:center;
  box-shadow:var(--shadow-lg);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#toast.err{background:var(--danger);}

/* ---------- MISC ---------- */
.divider-text{
  text-align:center;
  color:var(--text-2);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  margin:18px 0 10px;
  font-weight:700;
}
.helper-text{font-size:12px; color:var(--text-2); margin-top:-8px; margin-bottom:14px;}
.section-gap{height:6px;}
a.link-btn{color:var(--green); font-size:13px; font-weight:600; text-decoration:none;}

textarea{resize:vertical; min-height:60px;}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

.mode-paiement-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.btn-mode-paiement{
  background:var(--surface-3);
  color:var(--text);
  font-size:13.5px;
  padding:13px 10px;
}
.btn-mode-paiement:active{background:var(--surface-3);}

.modes-totaux-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.loader{
  border:3px solid var(--border);
  border-top-color:var(--green-deep);
  border-radius:50%;
  width:30px;height:30px;
  animation:spin 0.8s linear infinite;
  margin:30px auto;
}
@keyframes spin{to{transform:rotate(360deg);}}

.btn-icon.admin-toggle{
  background:var(--surface-2);
  color:var(--text-2);
}
.btn-icon.admin-toggle.active{
  background:var(--bg);
  color:var(--gold);
}

/* ---------- USER PILL (topbar) ---------- */
.user-pill{
  width:auto !important;
  padding:0 12px;
  font-size:12.5px;
  font-weight:700;
  white-space:nowrap;
}

/* ---------- ÉCRAN DE CONNEXION ---------- */
#loginScreen{
  display:none;
  position:fixed;
  inset:0;
  background:linear-gradient(160deg, var(--surface-3), var(--surface-3));
  z-index:500;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-box{
  width:100%;
  max-width:340px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.login-logo{font-size:48px; margin-bottom:8px;}
.login-employe-list{
  display:flex;
  flex-direction:column;
  gap:10px;
  width:100%;
}
.login-employe-btn{
  background:rgba(255,255,255,0.12);
  border:1.5px solid rgba(255,255,255,0.25);
  color:var(--text);
  padding:16px;
  border-radius:14px;
  font-size:17px;
  font-weight:700;
  font-family:'Figtree',sans-serif;
  cursor:pointer;
}
.login-employe-btn:active{background:rgba(255,255,255,0.25);}

.pin-dots{
  display:flex;
  gap:14px;
  margin-bottom:26px;
}
.pin-dot{
  width:16px; height:16px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.5);
  background:transparent;
}
.pin-dot.filled{background:var(--surface); border-color:var(--border);}

.pin-pad{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:14px;
  width:100%;
  max-width:260px;
  margin-bottom:20px;
}
.pin-key{
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.2);
  color:var(--text);
  font-size:22px;
  font-weight:600;
  border-radius:50%;
  width:70px;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  margin:0 auto;
}
.pin-key:active{background:rgba(255,255,255,0.25);}
.pin-key-action{font-size:18px; background:transparent; border:none;}

/* Variante du pavé numérique pour fond clair (écran Tickets) */
.ticket-key{
  background:var(--surface-2);
  border:1.5px solid var(--border);
  color:var(--text);
}
.ticket-key:active{background:var(--surface-2);}
.ticket-key.pin-key-action{
  background:transparent;
  border:none;
  color:var(--red);
}
.ticket-key.pin-key-action:active{background:rgba(182,64,47,0.1);}

.link-btn-light{
  background:none;
  border:none;
  color:var(--faint);
  font-size:13px;
  font-weight:600;
  text-decoration:underline;
  cursor:pointer;
  font-family:'Figtree',sans-serif;
}

/* ---------- RESPONSIVE : tablette / PC ----------
   Sur petit écran (téléphone), rien ne change : la colonne reste à 560px.
   Au-delà de 700px de largeur d'écran, on élargit progressivement la
   colonne centrale pour mieux utiliser l'espace disponible, au lieu de
   laisser du vide à gauche et à droite. */
@media (min-width: 700px) {
  #app, .bottom-nav, .modal-sheet {
    max-width: 720px;
  }
}
@media (min-width: 1000px) {
  #app, .bottom-nav, .modal-sheet {
    max-width: 1000px;
  }
  #screen {
    padding-left: 32px;
    padding-right: 32px;
  }
}

/* ==========================================================================
   LE MENU — thème sombre premium commun aux applis du pack (01/11/2026)
   ========================================================================== */
html{color-scheme:dark}
body{
  font-family:var(--font)!important;color:var(--text);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 500px at 8% -10%,rgba(226,190,106,.08),transparent 60%),
    radial-gradient(700px 420px at 100% 0%,rgba(120,130,255,.06),transparent 60%),
    var(--bg)!important;
  background-attachment:fixed!important;
}
input,select,button,textarea{font-family:inherit}
h1,h2{letter-spacing:.1px}
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=datetime-local],
input[type=password],input[type=search],input[type=url],input:not([type]),select,textarea{
  background-color:var(--bg-deep);color:var(--text);border-color:var(--border);transition:border-color .2s,box-shadow .2s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)!important;box-shadow:0 0 0 3px var(--gold-soft)}
input::placeholder,textarea::placeholder{color:var(--faint)}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--gold)}
input[type=file]::file-selector-button{background:var(--surface-3);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;margin-right:8px;cursor:pointer;font-weight:600}
table{border-color:var(--line)}
th{color:var(--text-2)}
hr{border-color:var(--line)}
a{color:var(--gold)}
::selection{background:var(--gold-soft);color:var(--gold-hi)}
*::-webkit-scrollbar{width:10px;height:8px}
*::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:10px;border:2px solid var(--bg)}
*::-webkit-scrollbar-track{background:transparent}
.brand-mark-premium{
  display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;vertical-align:middle;margin-right:8px;
  background:var(--grad-gold);color:var(--ink);font-family:var(--font-display);font-style:italic;font-size:19px;font-weight:400;
  box-shadow:0 6px 16px -6px rgba(226,190,106,.6),inset 0 1px 0 rgba(255,255,255,.5);
}
/* Impression : on repasse automatiquement en noir sur blanc */
@media print{
  :root{
    --bg:#fff;--bg-deep:#fff;--surface:#fff;--surface-2:#fff;--surface-3:#f2f2f2;--border:#999;--line:#ccc;--line-strong:#999;
    --text:#000;--text-2:#222;--muted:#444;--faint:#666;--gold:#000;--gold-hi:#000;--gold-lo:#000;--ink:#000;
    --green:#0a6b3a;--green-deep:#0a6b3a;--red:#a31515;--danger:#a31515;--blue:#0b4f8a;--blue-hi:#0b4f8a;--blue-deep:#0b4f8a;
    --orange:#8a4b00;--amber:#8a5a00;--violet:#4b2a8a;--violet-hi:#4b2a8a;--green-hi:#0a6b3a;
    --green-bg:transparent;--red-bg:transparent;--blue-bg:transparent;--amber-bg:transparent;--violet-bg:transparent;--gold-soft:transparent;
  }
  html{color-scheme:light}
  body{background:#fff!important;color:#000!important}
}
</style>
</head>
<body>

<div id="app">

  <!-- ============================================================ -->
  <!-- TOPBAR -->
  <!-- ============================================================ -->
  <div class="topbar">
    <div>
      <h1>🦪 Comptage Caisse</h1>
      <div class="sub" id="topbarSub">Moule &amp; Smile</div>
      <div class="build-tag">v.01/11/2026 18:55</div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="sync-pill" id="syncPill"><span class="sync-dot off" id="syncDot"></span><span id="syncText">hors ligne</span></span>
      <button class="btn-icon user-pill" id="userPill" onclick="Auth.changerUtilisateur()">👤 ?</button>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- SCREEN (contenu dynamique injecté en JS) -->
  <!-- ============================================================ -->
  <div id="screen">
    <div class="loader"></div>
  </div>

  <!-- ============================================================ -->
  <!-- ÉCRAN DE CONNEXION (PIN employé) -->
  <!-- ============================================================ -->
  <div id="loginScreen"></div>

  <!-- ============================================================ -->
  <!-- BOTTOM NAV -->
  <!-- ============================================================ -->
  <div class="bottom-nav">
    <button class="nav-item" id="navNouveau" onclick="Nav.go('nouveau')">
      <span class="ic">➕</span><span class="lb">Nouveau</span>
    </button>
    <button class="nav-item" id="navTickets" onclick="Nav.go('tickets')">
      <span class="ic">🧾</span><span class="lb">Tickets</span>
    </button>
    <button class="nav-item" id="navPetitecaisse" onclick="Nav.go('petitecaisse')">
      <span class="ic">🪙</span><span class="lb">P. caisse</span>
    </button>
    <button class="nav-item" id="navHistorique" onclick="Nav.go('historique')">
      <span class="ic">📋</span><span class="lb">Historique</span>
    </button>
    <button class="nav-item" id="navStats" onclick="Nav.go('stats')">
      <span class="ic">📊</span><span class="lb">Stats</span>
    </button>
    <button class="nav-item" id="navReglages" onclick="Nav.go('reglages')">
      <span class="ic">⚙️</span><span class="lb">Réglages</span>
    </button>
  </div>

</div>

<div id="toast"></div>
